title: Clear Windows Event Logs via Wevtutil or PowerShell
id: 1e8aa949-8266-422d-8004-c90a568ce8c0
name: detect_clear_windows_event_logs_cmdline
status: experimental
description: Detects the execution of commands used to clear Windows Event Logs (wevtutil or PowerShell). Adversaries often clear logs to hide their activities, remove indicators of compromise (IoCs), and evade detection after compromising a system.
author: Sebastien Xia
references:
  - https://attack.mitre.org/techniques/T1685/005/
date: 2026-11-09
logsource:
  category: process_creation
  product: windows
detection:
  # Block 1: the wevtutil binary (also catches a renamed copy via OriginalFileName)
  selection_wevtutil_img:
    - Image|endswith: '\wevtutil.exe'
    - OriginalFileName: 'wevtutil.exe'
  # Block 2: the clear command, short and long form
  # No filter on the log name: clearing Sysmon or PowerShell logs is just as suspicious
  selection_wevtutil_cli:
    CommandLine|contains:
      - ' cl '
      - ' clear-log '
  # Block 3: PowerShell deletion commands
  selection_powershell:
    CommandLine|contains:
      - 'Clear-EventLog'
      - 'Remove-EventLog'
  # (wevtutil binary AND clear command) OR PowerShell
  condition: all of selection_wevtutil_* or selection_powershell
fields:
  - Image
  - CommandLine
falsepositives:
  - Legitimate administrative scripts used for system maintenance (should be excluded by user or path in production).
  - Software uninstallation or troubleshooting processes initiated by IT staff.
level: high
tags:
  - attack.defense-impairment
  - attack.t1685.005
