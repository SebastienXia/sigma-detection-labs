
title: Clear Windows Event Logs (Event ID 104)
id: a6cb2c7c-35fd-4bcd-83e1-5eabc59f2c2a
name: detect_clear_windows_system_event_log
status: experimental
description: Detects the clearing of Windows event logs by monitoring the System log for Event ID 104. This acts as a global safety net. Clearing ANY log (Application, PowerShell, Sysmon...) will trigger this Event ID 104 within the System log.
author: Sebastien Xia
references:
  - https://attack.mitre.org/techniques/T1685/005/
  - https://lantern.splunk.com/Security_Use_Cases/Security_Monitoring/Detecting_a_ransomware_attack/Windows_event_log_cleared 
date: 2026-11-09
modified: 2026-11-09
logsource:
  product: windows
  # We specifically target the system log to intercept the event generated by Windows
  service: system
detection:
  selection:
    EventID: 104
  condition: selection
fields:
  - UserData_LogFile # We specifically target the system log to intercept the event generated by Windows
  - SubjectUserName
falsepositives:
  - Legitimate administrative cleanup (very rare in modern enterprise environments, should always be investigated).
level: high
tags:
  - attack.t1685.005
  - attack.defense_impairment
